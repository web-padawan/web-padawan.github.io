name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.9.0
        with:
          branch: gh-pages
          folder: build
